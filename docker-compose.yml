version: "3.9"

services:
  # ─── PostgreSQL Databases ────────────────────────────────────
  user-db:
    image: postgres:17
    container_name: split-user-db
    environment:
      POSTGRES_USER: split
      POSTGRES_PASSWORD: split_secret
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - split-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  group-db:
    image: postgres:17
    container_name: split-group-db
    environment:
      POSTGRES_USER: split
      POSTGRES_PASSWORD: split_secret
      POSTGRES_DB: group_db
    ports:
      - "5434:5432"
    volumes:
      - group-db-data:/var/lib/postgresql/data
    networks:
      - split-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split -d group_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  expense-db:
    image: postgres:17
    container_name: split-expense-db
    environment:
      POSTGRES_USER: split
      POSTGRES_PASSWORD: split_secret
      POSTGRES_DB: expense_db
    ports:
      - "5435:5432"
    volumes:
      - expense-db-data:/var/lib/postgresql/data
    networks:
      - split-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split -d expense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  settlement-db:
    image: postgres:17
    container_name: split-settlement-db
    environment:
      POSTGRES_USER: split
      POSTGRES_PASSWORD: split_secret
      POSTGRES_DB: settlement_db
    ports:
      - "5436:5432"
    volumes:
      - settlement-db-data:/var/lib/postgresql/data
    networks:
      - split-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U split -d settlement_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Go Microservices ────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: split-user-service
    environment:
      DB_HOST: user-db
      DB_PORT: 5432
      DB_USER: split
      DB_PASSWORD: split_secret
      DB_NAME: user_db
      GRPC_PORT: 50051
      JWT_SECRET: split-jwt-secret-key-change-in-production
    ports:
      - "50051:50051"
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - split-network

  group-service:
    build:
      context: .
      dockerfile: services/group-service/Dockerfile
    container_name: split-group-service
    environment:
      DB_HOST: group-db
      DB_PORT: 5432
      DB_USER: split
      DB_PASSWORD: split_secret
      DB_NAME: group_db
      GRPC_PORT: 50052
    ports:
      - "50052:50052"
    depends_on:
      group-db:
        condition: service_healthy
    networks:
      - split-network

  expense-service:
    build:
      context: .
      dockerfile: services/expense-service/Dockerfile
    container_name: split-expense-service
    environment:
      DB_HOST: expense-db
      DB_PORT: 5432
      DB_USER: split
      DB_PASSWORD: split_secret
      DB_NAME: expense_db
      GRPC_PORT: 50053
    ports:
      - "50053:50053"
    depends_on:
      expense-db:
        condition: service_healthy
    networks:
      - split-network

  settlement-service:
    build:
      context: .
      dockerfile: services/settlement-service/Dockerfile
    container_name: split-settlement-service
    environment:
      DB_HOST: settlement-db
      DB_PORT: 5432
      DB_USER: split
      DB_PASSWORD: split_secret
      DB_NAME: settlement_db
      GRPC_PORT: 50054
    ports:
      - "50054:50054"
    depends_on:
      settlement-db:
        condition: service_healthy
    networks:
      - split-network

  # ─── GraphQL API Gateway ─────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: split-gateway
    environment:
      PORT: 4000
      USER_SERVICE_URL: user-service:50051
      GROUP_SERVICE_URL: group-service:50052
      EXPENSE_SERVICE_URL: expense-service:50053
      SETTLEMENT_SERVICE_URL: settlement-service:50054
      JWT_SECRET: split-jwt-secret-key-change-in-production
    ports:
      - "4000:4000"
    depends_on:
      - user-service
      - group-service
      - expense-service
      - settlement-service
    networks:
      - split-network

  # ─── Next.js Frontend ────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: split-frontend
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - split-network

volumes:
  user-db-data:
  group-db-data:
  expense-db-data:
  settlement-db-data:

networks:
  split-network:
    driver: bridge
