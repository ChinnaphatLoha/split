version: "3.9"

services:
  # ─── Go Microservices ────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: split-user-service-prod
    restart: always
    environment:
      DATABASE_URL: ${USER_DB_URL}
      GRPC_PORT: 50051
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - split-network-prod

  group-service:
    build:
      context: .
      dockerfile: services/group-service/Dockerfile
    container_name: split-group-service-prod
    restart: always
    environment:
      DATABASE_URL: ${GROUP_DB_URL}
      GRPC_PORT: 50052
    networks:
      - split-network-prod

  expense-service:
    build:
      context: .
      dockerfile: services/expense-service/Dockerfile
    container_name: split-expense-service-prod
    restart: always
    environment:
      DATABASE_URL: ${EXPENSE_DB_URL}
      GRPC_PORT: 50053
    networks:
      - split-network-prod

  settlement-service:
    build:
      context: .
      dockerfile: services/settlement-service/Dockerfile
    container_name: split-settlement-service-prod
    restart: always
    environment:
      DATABASE_URL: ${SETTLEMENT_DB_URL}
      GRPC_PORT: 50054
    networks:
      - split-network-prod

  # ─── GraphQL API Gateway ─────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: split-gateway-prod
    restart: always
    environment:
      PORT: 4000
      USER_SERVICE_URL: user-service:50051
      GROUP_SERVICE_URL: group-service:50052
      EXPENSE_SERVICE_URL: expense-service:50053
      SETTLEMENT_SERVICE_URL: settlement-service:50054
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${FRONTEND_URL}
    depends_on:
      - user-service
      - group-service
      - expense-service
      - settlement-service
    networks:
      - split-network-prod

  # ─── Caddy Reverse Proxy (Exposes Gateway via HTTPS) ─────────
  caddy:
    image: caddy:2-alpine
    container_name: split-caddy
    restart: always
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    networks:
      - split-network-prod

volumes:
  caddy_data:
  caddy_config:

networks:
  split-network-prod:
    driver: bridge
